version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      # Persist SQLite database
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/cyberpunk.db
      - SECRET_KEY=${SECRET_KEY}
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_data:
